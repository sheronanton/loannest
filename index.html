<style id="loannest-scroll-v571">
/* v5.7.1: the scrollbar indicator appears during scroll, then hides.
   Track is transparent, keeping the layout and touch scrolling intact. */
:root { --ln-scroll-indicator:rgba(165,25,46,.72); }
:root[data-mode="dark"] { --ln-scroll-indicator:rgba(231,77,96,.70); }
:where(html,body,*) { scrollbar-width:thin; scrollbar-color:transparent transparent; }
:where(html,body,*).ln-scroll-active {
  scrollbar-width:thin;
  scrollbar-color:var(--ln-scroll-indicator) transparent;
}
:where(html,body,*)::-webkit-scrollbar { width:6px; height:6px; }
:where(html,body,*)::-webkit-scrollbar-track { background:transparent; }
:where(html,body,*)::-webkit-scrollbar-corner { background:transparent; }
:where(html,body,*)::-webkit-scrollbar-thumb {
  background-color:transparent;
  border-radius:999px;
  border:1px solid transparent;
  background-clip:padding-box;
}
:where(html,body,*).ln-scroll-active::-webkit-scrollbar-thumb {
  background-color:var(--ln-scroll-indicator);
}
/* The category chip row has its own permanently hidden horizontal bar. */
.category-strip { scrollbar-width:none!important; }
.category-strip::-webkit-scrollbar { display:none!important; }
@media (max-width:650px) {
  :where(html,body,*)::-webkit-scrollbar { width:3px; height:3px; }
}
/* Do not suppress OS-managed high-contrast scrollbars. */
@media(forced-colors:active){
  :where(html,body,*) { scrollbar-color:auto!important; scrollbar-width:auto!important; }
  :where(html,body,*)::-webkit-scrollbar { width:auto; height:auto; }
  :where(html,body,*)::-webkit-scrollbar-thumb { background-color:CanvasText; }
}
</style>

<script>
(() => {
'use strict';
 const MOTION_KEY='loannest-motion-v1';
 let motionEnabled=true;
 try{motionEnabled=localStorage.getItem(MOTION_KEY)!=='off'}catch{}
 document.documentElement.dataset.motion=motionEnabled?'on':'off';
 function syncMotionControls(){const b=document.querySelector('#motion-switch');if(b){b.setAttribute('aria-checked',String(motionEnabled));b.setAttribute('aria-label',motionEnabled?'Turn off interface animations':'Turn on interface animations')}const h=document.querySelector('#motion-state');if(h)h.textContent=motionEnabled?'On':'Off'}
 function saveMotion(){document.documentElement.dataset.motion=motionEnabled?'on':'off';try{localStorage.setItem(MOTION_KEY,motionEnabled?'on':'off')}catch{}syncMotionControls()}
 function replayMotionPreview(){const element=document.querySelector('.motion-demo');if(!element||!motionEnabled)return;element.classList.remove('play');void element.offsetWidth;element.classList.add('play')}
 const APPEARANCE_KEY='loannest-editorial-red-appearance-v1';
 const APPEARANCE_DEFAULT={mode:'light',primary:'#c92339',secondary:'#424242'};
 const APPEARANCE_PRESETS={noir:{primary:'#686868',secondary:'#9c9c9c'},ocean:{primary:'#606060',secondary:'#939393'},forest:{primary:'#7f7f7f',secondary:'#a6a6a6'},royal:{primary:'#555555',secondary:'#939393'},sunset:{primary:'#727272',secondary:'#717171'}};
 let appearance={...APPEARANCE_DEFAULT};
 const validHex=s=>/^#[0-9a-fA-F]{6}$/.test(s);
 function appearanceContrast(hex){const channels=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);return .2126*channels[0]+.7152*channels[1]+.0722*channels[2]>.34?'#1e1e1e':'#ffffff'}
 function loadAppearance(){try{const raw=localStorage.getItem(APPEARANCE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&['light','dark'].includes(parsed.mode)&&validHex(parsed.primary)&&validHex(parsed.secondary))appearance={mode:parsed.mode,primary:parsed.primary.toLowerCase(),secondary:parsed.secondary.toLowerCase()}}}catch{}applyAppearance()}
 function saveAppearance(){try{localStorage.setItem(APPEARANCE_KEY,JSON.stringify(appearance))}catch{notify('Unable to save appearance preferences in this browser.',true)}applyAppearance()}
 function applyAppearance(){
  const root=document.documentElement;
  if(appearance.mode!=='light')appearance.mode='dark';
  appearance.primary=appearance.mode==='dark'?'#f25267':'#c92339';
  appearance.secondary=appearance.mode==='dark'?'#c9c9c9':'#444444';

  document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute('content',appearance.mode==='dark'?'black-translucent':'default');
  syncAppearanceControls();
 }
 function currentPreset(){return Object.keys(APPEARANCE_PRESETS).find(key=>APPEARANCE_PRESETS[key].primary===appearance.primary&&APPEARANCE_PRESETS[key].secondary===appearance.secondary)||null}
 function syncAppearanceControls(){const toggle=document.querySelector('#quick-theme-toggle');if(toggle){const next=appearance.mode==='dark'?'light':'dark';toggle.setAttribute('aria-label','Switch to '+next+' mode');toggle.title='Switch to '+next+' mode';toggle.innerHTML='<svg aria-hidden="true"><use href="#i-'+(appearance.mode==='dark'?'sun':'moon')+'"/></svg>'}document.querySelectorAll('.theme-mode-choice').forEach(el=>{const selected=el.dataset.mode===appearance.mode;el.classList.toggle('active',selected);el.setAttribute('aria-pressed',String(selected))});document.querySelectorAll('.theme-preset').forEach(el=>{const selected=el.dataset.preset===currentPreset();el.classList.toggle('active',selected);el.setAttribute('aria-pressed',String(selected))});for(const role of ['primary','secondary']){const picker=document.querySelector('#theme-'+role+'-picker'),hex=document.querySelector('#theme-'+role+'-hex');if(picker)picker.value=appearance[role];if(hex)hex.value=appearance[role].toUpperCase()}const modeLabel=document.querySelector('#theme-current-mode');if(modeLabel)modeLabel.textContent=appearance.mode==='dark'?'Dark appearance':'Light appearance'}

const dateISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function enhanceDateInputs(root=document){
 root.querySelectorAll('input[type="date"],input[type="month"]').forEach(input=>{

 });

function openDatePicker(input){if(!input||input.disabled)return;

 const s=input.value||(picker.type==='month'?today().slice(0,7):today());
 const parts=s.split('-').map(Number);picker.year=parts[0];picker.month=parts[1]-1;
 if(!Number.isInteger(picker.year)||!Number.isInteger(picker.month)||picker.month<0||picker.month>11){picker.year=new Date().getFullYear();picker.month=new Date().getMonth()}
 updateDatePicker();if(!pickerDialog().open)pickerDialog().showModal();
}
function pickerAllowed(value){const inp=picker.input;if(!inp)return false;return (!inp.min||value>=inp.min)&&(!inp.max||value<=inp.max)}
const two=n=>String(n).padStart(2,'0');
function updateDatePicker(){const d=new Date(picker.year,picker.month,1,12),months=Array.from({length:12},(_,i)=>new Intl.DateTimeFormat('en-IN',{month:'short'}).format(new Date(2026,i,1))),monthLabel=new Intl.DateTimeFormat('en-IN',{month:'long'}).format(d);
 const pickerTitle=picker.type==='month'?'Choose month':'Choose date';
 const options=Array.from({length:151},(_,i)=>i+1950).map(y=>`<option value="${y}" ${y===picker.year?'selected':''}>${y}</option>`).join('');
 const dateSelects=picker.type==='date'?`<select id="dp-month" aria-label="Month">${months.map((m,i)=>`<option value="${i}" ${i===picker.month?'selected':''}>${m}</option>`).join('')}</select>`:'';
 const controls=`<div class="dp-controls"><button type="button" data-dp="prev" aria-label="Previous ${picker.type==='month'?'year':'month'}">${icon('chevron-left')}</button><div class="dp-selects">${dateSelects}<select id="dp-year" aria-label="Year">${options}</select></div><button type="button" data-dp="next" aria-label="Next ${picker.type==='month'?'year':'month'}">${icon('chevron-right')}</button></div>`;
 let body='';
 if(picker.type==='month')body=`<div class="dp-months">${months.map((name,i)=>{let value=`${picker.year}-${two(i+1)}`,disabled=!pickerAllowed(value);return `<button type="button" data-dp="choose" data-value="${value}" class="${picker.input.value===value?'selected':''}" ${disabled?'disabled':''}>${name}</button>`}).join('')}</div>`;
 else {const offset=(d.getDay()+6)%7,days=new Date(picker.year,picker.month+1,0,12).getDate();body=`<div class="dp-weekdays">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day=>`<span>${day}</span>`).join('')}</div><div class="dp-days">${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{const val=`${picker.year}-${two(picker.month+1)}-${two(i+1)}`;return `<button type="button" data-dp="choose" data-value="${val}" class="${val===picker.input.value?'selected':''} ${val===today()?'today':''}" ${!pickerAllowed(val)?'disabled':''}>${i+1}</button>`}).join('')}</div>`}
 $('#date-picker-content').innerHTML=`<div class="dp-inner"><div class="dp-top"><div><div class="dp-eyebrow">LOANNEST · DATE STUDIO</div><div class="dp-title">${pickerTitle}</div></div><button type="button" class="dp-close" data-dp="close" aria-label="Close date picker">${icon('x')}</button></div>${controls}${body}<div class="dp-bottom"><small>${picker.type==='month'?monthLabel+' '+picker.year:picker.input.value?`Selected: ${prettyDate(picker.input.value)}`:'Choose the installment date'}</small><button type="button" data-dp="today">${picker.type==='month'?'This month':'Today'}</button></div></div>`;
}
function handlePickerAction(el){const action=el.dataset.dp;if(action==='close'){pickerDialog().close();return}

 if(action==='today'){const value=picker.type==='month'?today().slice(0,7):today();if(!pickerAllowed(value)){const msg=picker.input?.max&&value>picker.input.max?'Today is after the allowed end date.':'Today is outside the allowed date range.';notify(msg,true);return}choosePickerValue(value);return}

// ICS exports allow Apple's built-in Calendar widget to show EMI events.
const icsEscape=s=>String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function icsCalendar(events){
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LoanNest//EMI Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:LoanNest EMIs'];
 for(const e of events){const d=parseDate(e.date);if(!d)continue;const day=e.date.replace(/-/g,''),after=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12),end=dateISO(after).replace(/-/g,'');
  const eventId=`${e.loan.id}-${e.id}`.replace(/[^a-zA-Z0-9-]/g,'').slice(0,160);
  lines.push('BEGIN:VEVENT',`UID:${eventId}@loannest.local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${day}`,`DTEND;VALUE=DATE:${end}`,`SUMMARY:${icsEscape('EMI #'+e.number+' · '+e.loan.title)}`,`DESCRIPTION:${icsEscape('Loan: '+e.loan.title+'\nInstallment: '+e.number+'\nPending EMI: '+money(e.amount)+'\nCategory: '+e.loan.category+'\nExported from LoanNest. This event does not sync automatically.')}`,'TRANSP:TRANSPARENT','END:VEVENT');
 }
 lines.push('END:VCALENDAR');
 const encoder=new TextEncoder();
 const fold=line=>{let sections=[],part='',bytes=0;for(const character of line){const width=encoder.encode(character).length;if(bytes+width>73){sections.push(part);part=' ';bytes=1}part+=character;bytes+=width}sections.push(part);return sections.join('\r\n')};
 return lines.map(fold).join('\r\n')+'\r\n';
}
function exportCalendar(kind){const unpaid=allEvents(2400);const next=unpaid.find(e=>e.date>=today())||unpaid[0];if(!next){notify('No unpaid installments are available to export.',true);return}const events=kind==='next'?[next]:unpaid;
 downloadFile(`LoanNest-${kind==='next'?'Next-EMI':'Unpaid-EMIs'}-${today()}.ics`,icsCalendar(events),'text/calendar;charset=utf-8');notify(`${events.length} EMI calendar event${events.length===1?'':'s'} exported. Import the .ics file on your iPhone.`)
}

// Keep the legacy v1 storage schema and extend it with optional correction history.
function hydrateBackup(parsed){return {version:VERSION,loans:parsed.loans,payments:parsed.payments,deletedPayments:Array.isArray(parsed.deletedPayments)?parsed.deletedPayments:[],auditTrail:Array.isArray(parsed.auditTrail)?parsed.auditTrail:[]}}
function paymentSnapshot(p){return p?{id:p.id,loanId:p.loanId,amount:p.amount,paidOn:p.paidOn,note:p.note||'',...(p.installmentId?{installmentId:p.installmentId}:{})}:null}
function auditPayment(action,loan,paymentId,before,after){state.auditTrail.push({id:uid(),at:new Date().toISOString(),action,loanId:loan.id,loanTitle:loan.title,paymentId,before:paymentSnapshot(before),after:paymentSnapshot(after)})}
// New payment mutations are atomic with respect to localStorage. Audit and trash are backed up with every change.
function commitPaymentChange(mutator){const previous=JSON.stringify(state);try{mutator();validateBackup(state);if(!persist()){state=JSON.parse(previous);return false}return true}catch(error){state=JSON.parse(previous);notify('Payment not changed: '+error.message,true);return false}}
function paymentAuditText(p){if(!p)return '—';return `${money(p.amount)} · ${prettyDate(p.paidOn)}${p.installmentId?' · targeted EMI':' · automatic allocation'}${p.note?' · '+p.note:''}`}
function auditRows(loanId){const events=state.auditTrail.filter(a=>!loanId||a.loanId===loanId).slice().reverse();return events.length?`<div class="audit-list">${events.slice(0,100).map(a=>{const label={created:'Recorded',edited:'Edited',deleted:'Deleted',restored:'Restored'}[a.action]||a.action;const detail=a.action==='edited'?`<span class="audit-old">Before: ${safe(paymentAuditText(a.before))}</span><span>After: ${safe(paymentAuditText(a.after))}</span>`:`<span>${safe(paymentAuditText(a.after||a.before))}</span>`;return `<div class="audit-item"><span class="audit-mark">${icon(a.action==='deleted'?'trash':a.action==='edited'?'pencil':'check')}</span><div class="audit-item-main"><div class="row between" style="gap:12px;flex-wrap:wrap"><strong>${safe(label)} payment</strong><time>${safe(new Date(a.at).toLocaleString('en-IN'))}</time></div>${loanId?'':`<small>${safe(a.loanTitle)}</small>`}<div class="audit-diff">${detail}</div></div></div>`}).join('')}</div>${events.length>100?`<p class="helper">Showing newest 100 of ${events.length} audit events. All entries remain in the JSON backup.</p>`:''}`:'<p class="panel-sub">No payment corrections recorded yet. Future payments, edits, deletions and restorations will appear here.</p>'}
function deletedPaymentRows(loanId){const records=state.deletedPayments.filter(d=>d.payment.loanId===loanId);return records.length?`<div class="recover-list">${records.slice().reverse().map(d=>`<div class="recover-item"><div><strong>${money(d.payment.amount)}</strong><div class="muted" style="font-size:12px;margin-top:4px">Paid ${prettyDate(d.payment.paidOn)} · Deleted ${safe(new Date(d.deletedAt).toLocaleString('en-IN'))}</div><div class="muted" style="font-size:12px;margin-top:3px">${safe(d.payment.note||'EMI payment')}</div></div><button type="button" class="btn btn-outline btn-sm" data-action="restorepayment" data-id="${safe(d.payment.id)}">${icon('clock')} Restore</button></div>`).join('')}</div>`:'<p class="panel-sub">No deleted payments for this loan.</p>'}
function deletePayment(id){const payment=state.payments.find(p=>p.id===id);if(!payment)return;const loan=state.loans.find(l=>l.id===payment.loanId);if(!loan)return;if(!confirm(`Delete payment ${exactMoney(payment.amount)} made on ${prettyDate(payment.paidOn)}? You can restore it later.`))return;
 if(!commitPaymentChange(()=>{state.payments=state.payments.filter(p=>p.id!==id);state.deletedPayments.push({payment:paymentSnapshot(payment),deletedAt:new Date().toISOString(),loanTitle:loan.title});auditPayment('deleted',loan,payment.id,payment,null)}))return;
 render();showPaymentUndo(payment.id);}
let recentEditUndo=null;
function showEditUndo(id,old){recentEditUndo={id,before:paymentSnapshot(old)};const toast=$('#toast');clearTimeout(toastTimer);toast.className='toast show';toast.innerHTML=`<span>Correction saved. Balance and audit updated.</span><button type="button" data-action="undoedit" data-id="${safe(id)}" class="toast-undo">Undo edit</button>`;toastTimer=setTimeout(()=>{toast.className='toast';toast.textContent='';recentEditUndo=null},12500)}
function undoEditedPayment(id){if(!recentEditUndo||recentEditUndo.id!==id){notify('The edit undo window has ended. Use Edit and the audit history to correct the record.',true);return}const current=state.payments.find(p=>p.id===id);if(!current)return;const loan=state.loans.find(l=>l.id===current.loanId);if(!loan)return;const original=recentEditUndo.before;if(!commitPaymentChange(()=>{state.payments=state.payments.map(p=>p.id===id?paymentSnapshot(original):p);auditPayment('edited',loan,id,current,original)}))return;recentEditUndo=null;render();notify('Payment edit reverted. Audit history updated.');}
function showPaymentUndo(paymentId){const toast=$('#toast');clearTimeout(toastTimer);toast.className='toast show';toast.innerHTML=`<span>Payment deleted. You can recover it any time.</span><button type="button" data-action="restorepayment" data-id="${safe(paymentId)}" class="toast-undo">Undo</button>`;toastTimer=setTimeout(()=>{toast.className='toast';toast.textContent=''},12500)}
function restorePayment(id){const deleted=state.deletedPayments.find(d=>d.payment.id===id);if(!deleted){notify('This payment is no longer in Deleted payments.',true);return}const loan=state.loans.find(l=>l.id===deleted.payment.loanId);if(!loan){notify('The original loan no longer exists, so this payment cannot be restored.',true);return}
 if(!commitPaymentChange(()=>{if(state.payments.some(p=>p.id===id))throw Error('This payment already exists');state.payments.push(paymentSnapshot(deleted.payment));state.deletedPayments=state.deletedPayments.filter(d=>d.payment.id!==id);auditPayment('restored',loan,id,null,deleted.payment)}))return;
 render();notify('Payment restored. Loan balances have been recalculated.');}
function editPaymentForm(id){const old=state.payments.find(p=>p.id===id);if(!old)return;const loan=state.loans.find(l=>l.id===old.loanId);if(!loan)return;
 // Exclude the current payment when showing available room for the corrected amount.
 const live=state.payments;let without=[];try{state.payments=live.filter(p=>p.id!==id);without=allocation(loan)}finally{state.payments=live}
 const possible=round(Math.max(0,loan.openingPendingAmount-live.filter(p=>p.loanId===loan.id&&p.id!==id).reduce((n,p)=>n+p.amount,0)));
 const options=without.map(i=>`<option value="${safe(i.id)}" data-remaining="${i.remaining}" ${old.installmentId===i.id?'selected':''}>#${i.index+1} · ${prettyDate(i.dueDate)} · ${money(i.remaining)} available</option>`).join('');
 modal(`${titleBar('Edit payment',`Correct payment for ${loan.title}`)}<form id="edit-payment-form" data-id="${safe(id)}"><div class="modal-body"><div class="notice">Original: ${money(old.amount)} · ${prettyDate(old.paidOn)}. Corrections are recorded in the audit history.</div><div class="form-group"><label for="e-installment">Apply payment to</label><select class="field" id="e-installment" name="installmentId"><option value="">Oldest unpaid installments automatically</option>${options}</select></div><div class="form-group"><label for="e-amount">Correct amount (₹) *</label><input class="field" type="number" step="0.01" min="0.01" max="${possible}" id="e-amount" name="amount" value="${old.amount}" required inputmode="decimal"></div><div class="form-group"><label for="e-date">Payment date *</label><input type="date" class="field" id="e-date" name="date" max="${today()}" value="${safe(old.paidOn)}" required></div><div class="form-group"><label for="e-note">Note</label><input class="field" id="e-note" name="note" value="${safe(old.note)}" maxlength="300"></div><p class="helper">Maximum available for this loan after excluding the original payment: ${money(possible)}. Editing never creates a second payment.</p><p class="payment-edit-error" id="payment-edit-error" role="alert"></p></div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close">Cancel</button><button class="btn btn-primary" type="submit">${icon('check')} Save correction</button></div></form>`);
}
function submitPaymentEdit(form){const id=form.dataset.id,old=state.payments.find(p=>p.id===id);if(!old){notify('Payment no longer exists.',true);return}const loan=state.loans.find(l=>l.id===old.loanId);if(!loan)return;
 const amount=round(Number(form.elements.namedItem('amount').value));const paidOn=form.elements.namedItem('date').value;const note=form.elements.namedItem('note').value.trim();const installmentId=form.elements.namedItem('installmentId').value;
 const error=$('#payment-edit-error');const fail=m=>{if(error)error.textContent=m;notify(m,true)};
 if(!finitePos(amount)||!parseDate(paidOn)||paidOn>today()||note.length>300){fail('Enter a valid amount, payment date and note.');return}
 const replacement={...paymentSnapshot(old),amount,paidOn,note};delete replacement.installmentId;if(installmentId)replacement.installmentId=installmentId;
 if(!commitPaymentChange(()=>{const index=state.payments.findIndex(p=>p.id===id);state.payments[index]=replacement;auditPayment('edited',loan,id,old,replacement)})){if(error)error.textContent='The correction would exceed the loan balance or the selected installment. Please review the amount.';return}
 closeModal();render();showEditUndo(id,old);}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);validateBackup(parsed);state=hydrateBackup(parsed);}}catch(e){console.error('Could not read saved data:',e);notify('Saved data could not be read. Please restore a backup.',true)}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));void saveBrowserSnapshot().catch(()=>{});return true}catch(e){notify('Could not save. Your browser storage may be full or disabled. Export your data.',true);return false}}
// Best-effort secondary browser storage. It does not survive deletion of site data.
function openSnapshotDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDB unavailable'));const request=indexedDB.open('loannest-snapshots-v1',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('backups'))request.result.createObjectStore('backups')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('IndexedDB access failed'))})}
async function saveBrowserSnapshot(){const db=await openSnapshotDb();const backup=JSON.parse(JSON.stringify(state));const day=today();return new Promise((resolve,reject)=>{const tx=db.transaction('backups','readwrite');const store=tx.objectStore('backups');store.put({backup, savedAt:new Date().toISOString()},'latest');const daily=store.get('day-'+day);daily.onsuccess=()=>{if(!daily.result)store.put({backup,savedAt:new Date().toISOString()},'day-'+day)};tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error)}})}
async function restoreBrowserSnapshot(){try{const db=await openSnapshotDb();const snapshot=await new Promise((resolve,reject)=>{const tx=db.transaction('backups','readonly');const req=tx.objectStore('backups').get('latest');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(!snapshot)throw Error('No browser snapshot exists yet');validateBackup(snapshot.backup);if(!confirm(`Replace your current data with the saved snapshot from ${snapshot.savedAt}?`))return;state=hydrateBackup(snapshot.backup);if(!persist())return;go('dashboard');notify('Browser snapshot restored.')}catch(e){notify('Cannot restore browser snapshot: '+e.message,true)}}
function paymentsFor(id){return state.payments.filter(p=>p.loanId===id)}
function paidFor(id){return round(paymentsFor(id).reduce((sum,p)=>sum+p.amount,0))}
function planFor(loan){
 if(Array.isArray(loan.installments)&&loan.installments.length)return [...loan.installments].sort((a,b)=>cmpDate(a.dueDate,b.dueDate)||a.id.localeCompare(b.id));
 let result=[],left=round(loan.openingPendingAmount);for(let i=0;i<2400&&left>.004;i++){
  const amount=round(Math.min(left,loan.emiAmount));result.push({id:`${loan.id}-standard-${i}`,dueDate:dueFor(loan.firstDueDate,i),amount,note:''});left=round(left-amount)
 }
 if(left>.004){const last=result[result.length-1];if(last)last.amount=round(last.amount+left)}
 return result
}
function allocation(loan){
 const plan=planFor(loan),credit=Object.fromEntries(plan.map(i=>[i.id,0])),byId=new Map(plan.map(i=>[i.id,i]));
 for(const payment of paymentsFor(loan.id)){
  let amount=round(payment.amount);
  const targeted=byId.get(payment.installmentId);
  if(targeted){const applied=Math.min(amount,round(targeted.amount-credit[targeted.id]));credit[targeted.id]=round(credit[targeted.id]+applied);amount=round(amount-applied)}
  for(const item of plan){if(amount<.005)break;const room=round(item.amount-credit[item.id]);if(room<.005)continue;const applied=Math.min(room,amount);credit[item.id]=round(credit[item.id]+applied);amount=round(amount-applied)}
 }
 return plan.map((item,index)=>({...item,index,paid:credit[item.id],remaining:round(Math.max(0,item.amount-credit[item.id]))}))
}
function calc(loan){const items=allocation(loan),total=paidFor(loan.id),pending=round(Math.max(0,loan.openingPendingAmount-total)),closed=pending<.005,first=items.find(i=>i.remaining>.004);return {total,pending,closed,next:first?.dueDate||null,dueAmount:first?.remaining||0,nextItem:first,remainingCount:items.filter(i=>i.remaining>.004).length,progress:loan.openingPendingAmount?Math.min(100,100*total/loan.openingPendingAmount):0}}
function statusFor(loan){let s=calc(loan);if(s.closed)return {text:'Paid off',className:'ok'};let days=daysUntil(s.next);if(days<0)return {text:`${-days}d overdue`,className:'overdue'};if(days===0)return {text:'Due today',className:'soon'};if(days===1)return {text:'Tomorrow',className:'soon'};if(days<=7)return {text:`In ${days} days`,className:'soon'};return {text:`${days}d left`,className:'normal'}}
function statusTag(s){return `<span class="status ${s.className}">${safe(s.text)}</span>`}
function activeLoans(){return state.loans.filter(l=>!calc(l).closed)}
function allEvents(limitPerLoan=120){let events=[];for(const loan of state.loans){for(const installment of allocation(loan).filter(i=>i.remaining>.004).slice(0,limitPerLoan)){events.push({id:installment.id,loan,date:installment.dueDate,amount:installment.remaining,number:installment.index+1,note:installment.note})}}return events.sort((a,b)=>cmpDate(a.date,b.date)||a.loan.title.localeCompare(b.loan.title))}

const colorForCategory=category=>{if(CATEGORY_COLORS[category])return CATEGORY_COLORS[category];const palette=['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)','var(--cat-7)'];let hash=0;for(const char of category)hash=(hash*31+char.charCodeAt(0))>>>0;return palette[hash%palette.length]};

 </button>`
}

function projection(events){let now=parseDate(today()),months=[];for(let n=0;n<6;n++){let first=new Date(now.getFullYear(),now.getMonth()+n,1,12),month=`${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}`,value=events.filter(e=>e.date.startsWith(month)).reduce((s,e)=>s+e.amount,0);months.push({label:new Intl.DateTimeFormat('en-IN',{month:'short'}).format(first),value})}const max=Math.max(1,...months.map(m=>m.value));if(!months.some(m=>m.value>0))return `<div class="chart-empty">Add loans to see your 6-month EMI outlook.</div>`;return `<div class="bar-chart" role="img" aria-label="EMI amounts for the next 6 calendar months: ${months.map(m=>`${m.label}: ${money(m.value)}`).join(', ')}">${months.map(m=>`<div class="chart-col" title="${safe(m.label)}: ${money(m.value)}"><div class="bar-wrap"><div class="bar" style="height:${Math.max(3,100*m.value/max)}%"></div></div><span>${safe(m.label)}</span></div>`).join('')}</div>`}

function wizardGenerate(){

 const missing=[];
 if(!$('#w-total').value||!finitePos(total))missing.push(['w-total','Total scheduled repayments']);
 if(!monthOK(start))missing.push(['w-start','Start month']);
 if(!monthOK(end))missing.push(['w-end','End month']);
 if(!$('#w-day').value||!Number.isInteger(day)||day<1||day>31)missing.push(['w-day','EMI due day (1–31)']);
 if(!$('#w-emi').value||!finitePos(emi))missing.push(['w-emi','Regular EMI']);

 if(missing.length)return wizardProblem(`Please complete or correct: ${missing.map(x=>x[1]).join(', ')}.`,missing.map(x=>x[0]));
 if(n<1)return wizardProblem('End month must be the same as or later than start month.',['w-end']);
 if(n>180)return wizardProblem('The maximum loan duration is 180 months (15 years).',['w-end']);
 if(paid>n)return wizardProblem(`Already paid installments cannot be greater than ${n}.`,['w-paid-count']);
 const final=round(total-round(emi*(n-1)));
 if(final<.01)return wizardProblem(`Regular EMI ${money(emi)} is too high for ${n} installments and a total repayment amount of ${money(total)}. Reduce the EMI or increase the repayment total.`,['w-emi','w-total']);

}

<script id="loannest-scroll-autohide-v571">
(() => {
  'use strict';
  // Works for the page plus nested scroll areas (AI chat, loan forms, schedules).
  // Listening in capture phase also catches scroll events that don't bubble.
  const timers = new WeakMap();
  const HIDE_DELAY_MS = 1050;
  function reveal(target) {
    const element = target === document || target === window || target === document.body
      ? (document.scrollingElement || document.documentElement)
      : target;
    if (!(element instanceof Element)) return;
    element.classList.add('ln-scroll-active');
    const previous = timers.get(element);
    if (previous !== undefined) clearTimeout(previous);
    timers.set(element, setTimeout(() => {
      element.classList.remove('ln-scroll-active');
      timers.delete(element);
    }, HIDE_DELAY_MS));
  }
  document.addEventListener('scroll', e => reveal(e.target), {capture:true, passive:true});
  // Some browsers dispatch viewport scrolling at window instead of document.
  window.addEventListener('scroll', () => reveal(document.scrollingElement || document.documentElement), {passive:true});
})();
</script>
